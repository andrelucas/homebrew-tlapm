name: TLAPM tap

on:
  push:
    paths: [Formula/tlapm.rb, scripts/update-formula.py, .github/workflows/tlapm.yml]
  pull_request:
    paths: [Formula/tlapm.rb, scripts/update-formula.py, .github/workflows/tlapm.yml]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tlapm-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bottle.outputs.tag }}
      version: ${{ steps.bottle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the source to bottle
        id: source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/update-formula.py
          fi
          if [[ "$GITHUB_EVENT_NAME" != schedule ]] || ! git diff --quiet -- Formula/tlapm.rb ||
             ! grep -q '^  bottle do$' Formula/tlapm.rb; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install fonts for the Isabelle build
        if: steps.source.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
      - name: Build and test the x86-64 Linux bottle
        id: bottle
        if: steps.source.outputs.build == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          git switch -c test-tlapm-formula
          git -c user.name=CI -c user.email=ci@example.invalid commit --allow-empty -qam 'Test TLAPM source'
          repository=${GITHUB_REPOSITORY##*/}
          tap="${GITHUB_REPOSITORY%/*}/${repository#homebrew-}"
          brew tap "$tap" "$PWD"
          formula="$tap/tlapm"
          brew install --build-bottle "$formula"
          version=$(brew info --json=v2 "$formula" | jq -er '.formulae[0].versions.stable')
          tag="tlapm-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          root_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          output="$RUNNER_TEMP/tlapm-bottle"
          mkdir -p "$output"
          (
            cd "$output"
            brew bottle --json --root-url="$root_url" "$formula"
            local_file=$(jq -er '.[].bottle.tags.x86_64_linux.local_filename' ./*.bottle.json)
            release_file=$(jq -er '.[].bottle.tags.x86_64_linux.filename' ./*.bottle.json)
            brew bottle --merge --write --no-commit ./*.bottle.json
            brew uninstall "$formula"
            brew trust --formula "$formula"
            brew install "./$local_file"
            brew test "$formula"
            brew linkage --test "$formula"
            if [[ "$local_file" != "$release_file" ]]; then
              mv -- "$local_file" "$release_file"
            fi
          )
          cp "$(brew --repository "$tap")/Formula/tlapm.rb" Formula/tlapm.rb
          git diff "$GITHUB_SHA" -- Formula/tlapm.rb > "$output/formula.patch"
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bottle.outputs.tag != '' && github.ref_name == github.event.repository.default_branch
        with:
          name: tlapm-bottle
          path: |
            ${{ runner.temp }}/tlapm-bottle/*.bottle*.tar.gz
            ${{ runner.temp }}/tlapm-bottle/formula.patch
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: test
    if: needs.test.outputs.tag != '' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tlapm-bottle
          path: ${{ runner.temp }}/tlapm-bottle
      - name: Publish the bottle before updating the tap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
          TLAPM_VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tlapm-bottle"
          bottles=("$output"/*.bottle*.tar.gz)
          [[ ${#bottles[@]} -eq 1 && -f "${bottles[0]}" ]]
          bottle=${bottles[0]}

          git apply --include=Formula/tlapm.rb "$output/formula.patch"
          digest=$(sha256sum "$bottle" | cut -d ' ' -f 1)
          grep -F "$digest" Formula/tlapm.rb

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$bottle" --target "$GITHUB_SHA" \
              --prerelease --title "TLAPM $TLAPM_VERSION" --notes 'x86-64 Linux bottle built on Ubuntu 24.04.'
          fi
          published_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -er --arg name "${bottle##*/}" '.assets[] | select(.name == $name).digest')
          if [[ "$published_digest" != "sha256:$digest" ]]; then
            echo "Published bottle checksum does not match the tested bottle" >&2
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Bottle TLAPM $TLAPM_VERSION" -- Formula/tlapm.rb
          git push origin "HEAD:$GITHUB_REF"
